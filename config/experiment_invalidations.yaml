  idiosyncratic_portfolio_validation_v1:
    invalidated_at_utc: "2026-10-21T05:40:58Z"
    severity: overlapping_five_day_returns_not_a_unique_nav_clock
    reason: >-
      The target-weight experiment evaluated every weekly signal with a full
      five-trading-day forward label. In 33 of 253 adjacent rebalance intervals
      the next execution arrived fewer than five trading days later, so the
      reported portfolio returns compounded overlapping holding windows. The
      model fits, target weights, turnover constraints and PIT industry/six-
      style exposure matching remain valid, but its portfolio performance and
      paired return intervals are not executable NAV evidence.
    unaffected_outputs:
      - idiosyncratic_portfolio_fit_audit/v1
      - idiosyncratic_portfolio_targets/v1
      - idiosyncratic_portfolio_exposures/v1
      - idiosyncratic_portfolio_exposure_match/v1
      - target-weight optimizer and style-replica feasibility findings
    invalid_outputs:
      - idiosyncratic_portfolio_summary/v1 return and Sharpe fields
      - idiosyncratic_portfolio_annual/v1 return fields
      - idiosyncratic_portfolio_paired_inference/v1 return conclusions
      - claims that the Phase 12.1 compounded return is a unique executable NAV
    superseded_by: idiosyncratic_share_execution_validation_v1
  engineering_quality_v1:
    invalidated_at_utc: "2026-10-21T03:00:00Z"
    severity: brittle_registry_count_gate_superseded
    reason: >-
      The immutable v1 snapshot is intact, but its live gate required an exact
      experiment count. Appending the valid forward_data_pipeline_v1 snapshot
      made that check fail even though the public index and all immutable
      directories reconciled one-to-one. V2 replaces the count equality with
      identity, uniqueness, immutability, and no-orphan checks and expands the
      critical protocol chain through Phase 11.1.
    unaffected_outputs:
      - all engineering_quality_v1 immutable snapshot files
      - canonical execution-market implementation finding
      - five-layer test inventory
    invalid_outputs:
      - claims that exact experiment count is a durable completeness invariant
      - engineering_quality_v1 live assertion status after new registrations
    superseded_by: engineering_quality_v2
  institutional_execution_v1:
    invalidated_at_utc: "2026-10-20T09:55:00Z"
    severity: registry_self_staging_dirty_flag
    reason: >-
      The research outputs and hashes are valid, but the experiment registry
      created its temporary snapshot directory inside the repository before
      capturing Git status. That self-created untracked directory caused the
      metadata to report dirty=true even though registration began from clean
      commit d1b00aedd5b3dcbc660733fa64288c550a83e446.
    unaffected_outputs:
      - all research tables, metrics, hashes, and snapshot-integrity records
    invalid_outputs:
      - metadata.json git.dirty field
    superseded_by: institutional_execution_v2
  portfolio_sensitivity_v1:
    invalidated_at_utc: "2026-10-20T06:10:00Z"
    severity: cost_stress_repricing_formula_superseded
    reason: >-
      The v1 fixed-fill execution cost stress subtracted turnover times the fee
      rate directly from gross return. The daily executor defines turnover over
      pre-trade NAV while return is measured over previous NAV, so exact C0
      reproduction additionally requires the pre-trade-to-previous-NAV ratio.
      The difference is small but the v1 stress grid is not an exact 20bp
      regression of the executable baseline.
    unaffected_outputs:
      - portfolio_sensitivity_protocol/v1 except the cost-stress method claim
      - portfolio_sensitivity_weekly/v1
      - portfolio_sensitivity_summary/v1
      - qualitative conclusion that returns decline as fixed costs rise
    invalid_outputs:
      - exact values in execution_cost_stress/v1
      - claims that execution_cost_stress/v1 exactly reproduces C0 at 20bp
    superseded_by: transaction_cost_model_v1
  factor_preprocessing_ablation_v1:
    invalidated_at_utc: "2026-10-14T12:45:00Z"
    severity: portfolio_metrics_invalid
    reason: >-
      Validation portfolios were formed after filtering rows with non-null future
      returns. RankIC and model-selection metrics used the correct realized subset,
      but Top-200 portfolio metrics had outcome-availability leakage.
    unaffected_outputs:
      - factor_preprocessing_ablation_selection/v1
      - factor_preprocessing_ablation_daily/v1
      - factor_preprocessing_ablation_factor_summary/v1
    invalid_outputs:
