research_start: "2006-01-01"
research_end: null

network:
  socket_timeout_seconds: 45
  max_attempts: 4
  retry_backoff_seconds: 5

# BaoStock's historical `query_all_stock(date)` snapshots form the initial,
# point-in-time eligible A-share universe.  This is deliberately NOT labelled
# as historical CSI membership; that requires a constituent-history source.
universe:
  name: "a_share_pit_proxy"
  snapshot_frequency: "weekly"
  exclude_bj_exchange: false
  minimum_adjacent_snapshot_coverage: 0.95

# Investable benchmarks required by the robustness suite and research dashboard.
# They are not members of the stock-selection universe.
benchmark_indices:
  - "sh.000300"
  - "sh.000905"
  - "sh.000852"

# BaoStock exposes historical CSRC-industry snapshots by query date.  Store the
# raw scheduled snapshots first; the risk-exposure stage derives an auditable broad
# industry code without pretending that this is historical Shenwan membership.
industry:
  source: "baostock.query_stock_industry"
  classification: "CSRC"
  snapshot_frequency: "month_end_plus_initial"
  asof_join: "latest_snapshot_on_or_before_signal_date"
  minimum_security_snapshot_coverage: 0.95
  default_workers: 1

# A fixed, deterministic sample is pulled from an independent source and
# compared to BaoStock. It is a data-quality check, never a data merge rule.
crosscheck:
  sample_size: 30
  price_tolerance: 0.02
  volume_tolerance: 0.05
