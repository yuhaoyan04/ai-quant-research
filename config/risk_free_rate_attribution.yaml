experiment_id: risk_free_rate_attribution_v1
source_experiments:
  - capm_attribution_v1
  - style_factor_attribution_v1
period: historical_oos_2021_2026
historical_oos_used_for_selection: false
download:
  provider: China Central Depository & Clearing Co., Ltd. (CCDC)
  provider_short: CCDC
  source_name: ChinaBond Government Bond Yield Curve
  source_url: https://yield.chinabond.com.cn/cbweb-pbc-web/pbc/showHistory?locale=en_US
  api_url: https://yield.chinabond.com.cn/cbweb-pbc-web/pbc/historyQuery
  curve_name: 中债国债收益率曲线
  start_date: '2020-12-01'
  end_date: '2026-09-30'
  maximum_window_days: 330
  request_retries: 3
  raw_quote_unit: percent_per_annum
  annual_quote_convention: published_yield_to_maturity_curve_annual_percent
  publication_timestamp_status: exact_intraday_timestamp_not_provided_by_history_endpoint
  availability_lag_calendar_days: 1
rate_scenarios:
  - scenario_id: R0_zero_rate
    tenor: zero
    source_column: null
    role: retained_legacy_control
  - scenario_id: R1_ccdc_cgb_3m
    tenor: 3M
    source_column: 3月
    role: primary_real_rate_baseline
  - scenario_id: R2_ccdc_cgb_1y
    tenor: 1Y
    source_column: 1年
    role: reliable_same_source_alternative_tenor_sensitivity
primary_rate_scenario: R1_ccdc_cgb_3m
zero_rate_scenario: R0_zero_rate
day_count_convention: ACT/365
annual_to_holding_period_conversion: (1+annual_rate_decimal)^(calendar_days/365)-1
maximum_staleness_calendar_days: 10
annualization_days: 252
newey_west_lags: 5
confidence_level: 0.95
primary_benchmark: CSI500
primary_execution_scenario: daily_retry_limit_and_suspension_constrained
market_benchmark_return_type: price_return_excluding_dividends
style_factor_return_convention: self_financing_long_short_gross_of_cost_no_rf_subtraction
regression_tolerance: 1.0e-12
scope_note: >-
  Descriptive risk-free-rate and attribution correction on already inspected historical OOS.
  No model, signal, portfolio, cost, execution, or benchmark selection is performed.
