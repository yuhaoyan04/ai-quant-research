experiment_id: transaction_cost_model_v1
source_experiment: constrained_portfolio_daily_execution_v1
historical_oos_used_for_selection: false
source_targets: {table: constrained_execution_targets, key: v1}
source_market: {table: constrained_daily_execution_market, key: v1}
source_daily_baseline: {table: constrained_daily_execution_daily, key: v1}
primary_execution_scenario: daily_retry_limit_and_suspension_constrained
annualization_periods: 252
baseline_round_trip_cost_bps: 20.0
c0_regression_tolerance: 1.0e-12
cost_path_policy: fixed_c0_fill_path_no_fee_feedback
notional_unit: normalized_portfolio_nav_not_cny

fixed_scenarios:
  - scenario_id: C1_fixed_000bp
    scenario_group: C1
    mode: fixed_round_trip
    round_trip_cost_bps: 0.0
    evidence_status: research_scenario
  - scenario_id: C1_fixed_010bp
    scenario_group: C1
    mode: fixed_round_trip
    round_trip_cost_bps: 10.0
    evidence_status: research_scenario
  - scenario_id: C0_fixed_020bp
    scenario_group: C0_C1
    mode: fixed_round_trip
    round_trip_cost_bps: 20.0
    evidence_status: existing_research_baseline
  - scenario_id: C1_fixed_040bp
    scenario_group: C1
    mode: fixed_round_trip
    round_trip_cost_bps: 40.0
    evidence_status: research_scenario
  - scenario_id: C1_fixed_060bp
    scenario_group: C1
    mode: fixed_round_trip
    round_trip_cost_bps: 60.0
    evidence_status: research_scenario
  - scenario_id: C1_fixed_100bp
    scenario_group: C1
    mode: fixed_round_trip
    round_trip_cost_bps: 100.0
    evidence_status: research_scenario

component_scenarios:
  - scenario_id: C2_public_levies_commission_scenario
    scenario_group: C2
    mode: components
    evidence_status: documented_public_levies_plus_explicit_broker_commission_assumption
    description: >-
      Date-effective public stamp-duty and transfer-fee rules plus a symmetric
      3bp commission scenario. This is not a historical broker statement and
      does not include a minimum commission because the research ledger uses
      normalized NAV rather than CNY account notionals.
    components:
      commission:
        minimum_fee_per_fill: 0.0
        evidence_status: explicit_scenario_not_historical_broker_truth
        rules:
          - {start_date: "2021-01-01", end_date: null, buy_bps: 3.0, sell_bps: 3.0}
      stamp_duty:
        minimum_fee_per_fill: 0.0
        evidence_status: official_tax_schedule
        sources:
          - https://www.mof.gov.cn/zhengwuxinxi/caizhengxinwen/200809/t20080919_76432.htm
          - https://fgk.chinatax.gov.cn/zcfgk/c102416/c5211343/content.html
        rules:
          - {start_date: "2021-01-01", end_date: "2023-08-27", buy_bps: 0.0, sell_bps: 10.0}
          - {start_date: "2023-08-28", end_date: null, buy_bps: 0.0, sell_bps: 5.0}
      transfer_fee:
        minimum_fee_per_fill: 0.0
        evidence_status: official_or_officially_reported_clearing_schedule
        sources:
          - https://big5.sse.com.cn/site/cht/www.sse.com.cn/aboutus/mediacenter/hotandd/c/c_20150912_3988866.shtml
          - https://www.chinaclear.cn/zdjs/editor_file/20220701154723234.pdf
        rules:
          - {start_date: "2021-01-01", end_date: "2022-04-28", buy_bps: 0.2, sell_bps: 0.2}
          - {start_date: "2022-04-29", end_date: null, buy_bps: 0.1, sell_bps: 0.1}
      spread:
        minimum_fee_per_fill: 0.0
        evidence_status: omitted_no_quote_data
        rules:
          - {start_date: "2021-01-01", end_date: null, buy_bps: 0.0, sell_bps: 0.0}
      market_impact:
        minimum_fee_per_fill: 0.0
        evidence_status: omitted_no_broker_calibration
        rules:
          - {start_date: "2021-01-01", end_date: null, buy_bps: 0.0, sell_bps: 0.0}

scope_note: >-
  C0 and C1 hold the C0 executed-share path fixed and only reprice its fills.
  C2 is an auditable scenario, not a claim of historical account-level fees.
  C3-C5 remain blocked pending bid-ask, ADV and broker-calibrated impact data.
