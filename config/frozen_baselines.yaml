registry_version: 1
selection_policy: validation_only
historical_oos_disclosure: >-
  The 2021-2026 block has already been inspected during project development.
  It is historical out-of-sample evidence, not a pristine production lockbox.
governance_required_for_new_registrations: true
governance_policy: research_governance.yaml

experiments:
  baseline_ridge_v1:
    title: Frozen Ridge factor-model baseline
    stage: model_and_portfolio_baseline
    model_version: ridge_v1
    dataset_version_method: sha256_of_registered_inputs_and_ingestion_manifest
    historical_oos_used_for_selection: false
    config_files:
      - preprocessing.yaml
      - model_features.yaml
      - model_baseline.yaml
      - portfolio.yaml
      - liquidity_stress.yaml
      - turnover_buffer.yaml
      - robustness.yaml
    input_tables:
      - {table: model_features, key: "2020"}
      - {table: model_validation_predictions, key: ridge_v1}
      - {table: model_oos_predictions, key: ridge_v1}
      - {table: turnover_buffer_oos_holdings, key: v1}
    metric_tables:
      - {table: model_selection, key: ridge_v1}
      - {table: model_oos_annual, key: ridge_v1}
      - {table: turnover_buffer_selection, key: v1}
      - {table: turnover_buffer_oos_summary, key: v1}
      - {table: robustness_cost_grid, key: v1, where: {model: ridge}}
      - {table: robustness_block_bootstrap, key: v1, where_prefix: {metric: ridge_}}
    figures:
      - reports/figures/oos_equity_curve.svg
      - reports/figures/oos_drawdown.svg
      - reports/figures/annual_rank_ic.svg

