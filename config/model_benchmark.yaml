  - {candidate: ridge_0.01, family: ridge, kind: ridge, penalty: 0.01}
  - {candidate: ridge_0.1, family: ridge, kind: ridge, penalty: 0.1}
  - {candidate: ridge_1, family: ridge, kind: ridge, penalty: 1.0}
  - {candidate: elastic_a0.0001_l10.1, family: elastic_net, kind: elastic_net, alpha: 0.0001, l1_ratio: 0.1}
