experiment_id: institutional_execution_v2
registry_version: 1
selection_policy: validation_only
historical_oos_disclosure: The 2021-2026 block has already been inspected during project
  development. It is historical out-of-sample evidence, not a pristine production
  lockbox.
governance_required_for_new_registrations: true
governance_policy: research_governance.yaml
experiment:
  title: Phase 5 auditable A-share daily execution state machine (clean registration)
  stage: institutional_daily_execution
  model_version: frozen_hgb_raw_order_state_machine_v1
  dataset_version_method: sha256_of_registered_inputs_and_ingestion_manifest
  historical_oos_used_for_selection: false
  evidence_class: historical_oos_descriptive
  research_selection_role: diagnostic
  claims_independent_evidence: false
  config_files:
  - institutional_execution.yaml
  - constrained_portfolio_daily_execution.yaml
  - transaction_cost_model.yaml
  - research_governance.yaml
  input_tables:
  - table: constrained_execution_targets
    key: v1
  - table: institutional_execution_market
    key: v1
  - table: institutional_execution_daily
    key: v1
  - table: institutional_execution_orders
    key: v1
  - table: institutional_execution_events
    key: v1
  - table: institutional_execution_fills
    key: v1
  - table: institutional_execution_positions
    key: v1
  - table: institutional_execution_corporate_actions
    key: v1
  metric_tables:
  - table: institutional_execution_protocol
    key: v1
  - table: institutional_execution_summary
    key: v1
  - table: institutional_execution_invariants
    key: v1
  - table: institutional_execution_order_status
    key: v1
  figures: []
resolved_configs:
  institutional_execution.yaml:
    experiment_id: institutional_execution_v1
    source_experiment: research_governance_v1
    evidence_class: historical_oos_descriptive
    research_selection_role: diagnostic
    claims_independent_evidence: false
    historical_oos_used_for_selection: false
    source_targets:
      table: constrained_execution_targets
      key: v1
    source_market:
      table: constrained_daily_execution_market
      key: v1
    candidate:
      model: hgb_shallow15_locked
      alpha_pipeline: raw
      strategy: raw__risk_constrained
    initial_cash_cny: 100000000.0
    execution_price: unadjusted_close
    marking_price: unadjusted_close
    execution_time: close
    return_timing: mark_to_market_then_close_execution
    round_trip_cost_bps: 20.0
    max_volume_participation: 0.1
    max_pending_trading_days: 5
    enforce_t_plus_one: true
    allow_margin: false
    allow_short_sales: false
    order_quantity_rules:
      main_board_buy_lot: 100
      main_board_sell_lot: 100
      star_market_minimum_order: 200
      star_market_increment: 1
      odd_lot_liquidation_allowed: true
    corporate_action_proxy:
      method: inferred_value_preserving_share_factor_from_vendor_pct_chg_and_raw_close
      activation_absolute_deviation: 0.005
      evidence_status: proxy_not_official_corporate_action_record
    scenarios:
    - scenario: daily_close_institutional_constraints
      enforce_trade_flags: true
      enforce_volume_participation: true
      enforce_order_quantity_rules: true
      enforce_t_plus_one: true
    - scenario: market_constraints_removed_upper_bound
      enforce_trade_flags: false
      enforce_volume_participation: false
      enforce_order_quantity_rules: true
      enforce_t_plus_one: true
    annualization_periods: 252
    scope_note: Close-price daily-bar approximation. It does not reconstruct intraday
      queue priority, bid/ask, order-book depth, exact fill time, IPO no-limit windows,
      or broker-specific order handling. The corporate-action factor is an auditable
      value-preserving proxy, not an official action ledger.
  constrained_portfolio_daily_execution.yaml:
    experiment_id: constrained_portfolio_daily_execution_v1
    historical_oos_used_for_selection: false
    source_experiment: constrained_portfolio_neutralization_v1
    source_holdings:
      table: constrained_portfolio_oos_holdings
      key: v1
    target_construction: risk_constrained
    round_trip_cost_bps: 20.0
    annualization_periods: 252
    label_horizon_trading_days: 5
    limit_detection_tolerance_percentage_points: 0.2
    bootstrap:
      block_length_trading_days: 20
      samples: 2000
      random_seed: 20261017
    rules:
      st_limit_pct: 5.0
      main_board_limit_pct: 10.0
      star_limit_pct: 20.0
      chinext_limit_pct_before_2020_08_24: 10.0
      chinext_limit_pct_after_2020_08_24: 20.0
    execution_convention: returns_accrue_before_close_trade_blocked_orders_retry_daily
    scope_note: conservative_close_limit_rule_intraday_queue_and_ipo_no_limit_windows_not_modeled
  transaction_cost_model.yaml:
    experiment_id: transaction_cost_model_v1
    source_experiment: constrained_portfolio_daily_execution_v1
    historical_oos_used_for_selection: false
    source_targets:
      table: constrained_execution_targets
      key: v1
    source_market:
      table: constrained_daily_execution_market
      key: v1
    source_daily_baseline:
      table: constrained_daily_execution_daily
      key: v1
    primary_execution_scenario: daily_retry_limit_and_suspension_constrained
    annualization_periods: 252
    baseline_round_trip_cost_bps: 20.0
    c0_regression_tolerance: 1.0e-12
    cost_path_policy: fixed_c0_fill_path_no_fee_feedback
    notional_unit: normalized_portfolio_nav_not_cny
    fixed_scenarios:
    - scenario_id: C1_fixed_000bp
      scenario_group: C1
      mode: fixed_round_trip
      round_trip_cost_bps: 0.0
      evidence_status: research_scenario
    - scenario_id: C1_fixed_010bp
      scenario_group: C1
      mode: fixed_round_trip
      round_trip_cost_bps: 10.0
      evidence_status: research_scenario
    - scenario_id: C0_fixed_020bp
      scenario_group: C0_C1
      mode: fixed_round_trip
      round_trip_cost_bps: 20.0
      evidence_status: existing_research_baseline
    - scenario_id: C1_fixed_040bp
      scenario_group: C1
      mode: fixed_round_trip
      round_trip_cost_bps: 40.0
      evidence_status: research_scenario
    - scenario_id: C1_fixed_060bp
      scenario_group: C1
      mode: fixed_round_trip
      round_trip_cost_bps: 60.0
      evidence_status: research_scenario
    - scenario_id: C1_fixed_100bp
      scenario_group: C1
      mode: fixed_round_trip
      round_trip_cost_bps: 100.0
      evidence_status: research_scenario
    component_scenarios:
    - scenario_id: C2_public_levies_commission_scenario
      scenario_group: C2
      mode: components
      evidence_status: documented_public_levies_plus_explicit_broker_commission_assumption
      description: Date-effective public stamp-duty and transfer-fee rules plus a
        symmetric 3bp commission scenario. This is not a historical broker statement
        and does not include a minimum commission because the research ledger uses
        normalized NAV rather than CNY account notionals.
      components:
        commission:
          minimum_fee_per_fill: 0.0
          evidence_status: explicit_scenario_not_historical_broker_truth
          rules:
          - start_date: '2021-01-01'
            end_date: null
            buy_bps: 3.0
            sell_bps: 3.0
        stamp_duty:
          minimum_fee_per_fill: 0.0
          evidence_status: official_tax_schedule
          sources:
          - https://www.mof.gov.cn/zhengwuxinxi/caizhengxinwen/200809/t20080919_76432.htm
          - https://fgk.chinatax.gov.cn/zcfgk/c102416/c5211343/content.html
          rules:
          - start_date: '2021-01-01'
            end_date: '2023-08-27'
            buy_bps: 0.0
            sell_bps: 10.0
          - start_date: '2023-08-28'
            end_date: null
            buy_bps: 0.0
            sell_bps: 5.0
        transfer_fee:
          minimum_fee_per_fill: 0.0
          evidence_status: official_or_officially_reported_clearing_schedule
          sources:
          - https://big5.sse.com.cn/site/cht/www.sse.com.cn/aboutus/mediacenter/hotandd/c/c_20150912_3988866.shtml
          - https://www.chinaclear.cn/zdjs/editor_file/20220701154723234.pdf
          rules:
          - start_date: '2021-01-01'
            end_date: '2022-04-28'
            buy_bps: 0.2
            sell_bps: 0.2
          - start_date: '2022-04-29'
            end_date: null
            buy_bps: 0.1
            sell_bps: 0.1
        spread:
          minimum_fee_per_fill: 0.0
          evidence_status: omitted_no_quote_data
          rules:
          - start_date: '2021-01-01'
            end_date: null
            buy_bps: 0.0
            sell_bps: 0.0
        market_impact:
          minimum_fee_per_fill: 0.0
          evidence_status: omitted_no_broker_calibration
          rules:
          - start_date: '2021-01-01'
            end_date: null
            buy_bps: 0.0
            sell_bps: 0.0
    scope_note: C0 and C1 hold the C0 executed-share path fixed and only reprice its
      fills. C2 is an auditable scenario, not a claim of historical account-level
      fees. C3-C5 remain blocked pending bid-ask, ADV and broker-calibrated impact
      data.
  research_governance.yaml:
    experiment_id: research_governance_v1
    policy_version: 1
    purpose: phase4_historical_oos_contamination_and_future_evidence_governance
    policy_frozen_date_utc: '2026-10-20'
    current_data_cutoff: '2026-09-30'
    historical_oos_used_for_selection: false
    new_model_selected: false
    evidence_periods:
      training:
        start_date: '2006-01-01'
        end_date: '2015-12-31'
        evidence_class: training
        selection_allowed: true
        already_observed: true
      validation_selection:
        start_date: '2016-01-01'
        end_date: '2020-12-31'
        evidence_class: validation_selection
        selection_allowed: true
        already_observed: true
      historical_oos:
        start_date: '2021-01-01'
        end_date: '2026-09-30'
        evidence_class: historical_oos
        selection_allowed_for_new_revisions: false
        already_observed: true
        consumed: true
        disclosure: inspected_repeatedly_during_research_not_a_pristine_lockbox
      future_lockbox:
        lockbox_id: future_lockbox_2026q4_2027q3_v1
        start_date: '2026-10-01'
        planned_end_date: '2027-09-30'
        evidence_class: future_lockbox
        selection_allowed: false
        already_observed: false
        initial_state: SEALED_EMPTY
        minimum_daily_observations: 252
        minimum_weekly_signal_observations: 52
        minimum_calendar_months: 12
        minimum_coverage_fraction: 0.95
        open_rule: planned_end_date_and_all_minimum_observation_gates
        interim_performance_access_allowed: false
        operational_health_access_allowed: true
        local_enforcement_is_cryptographic: false
      paper_trading:
        paper_id: paper_candidate_bundle_v1
        activation_rule: first_eligible_signal_strictly_after_candidate_freeze_commit
        retroactive_backfill_allowed: false
        evidence_class: paper_trading
        selection_allowed_for_same_version: false
        performance_reporting_frequency: monthly
        operational_health_reporting_frequency: daily
        modification_rule: any_outcome_driven_change_creates_new_candidate_version
    candidate_bundle:
      bundle_id: candidate_bundle_v1
      primary:
        model: hgb_shallow15_locked
        alpha_pipeline: raw
        portfolio_construction: risk_constrained
        selection_source: validation_2016_2020_only
      secondary:
      - model: hgb_shallow15_locked
        alpha_pipeline: industry_size_neutralized
        portfolio_construction: risk_constrained
      - model: ridge_locked
        alpha_pipeline: raw
        portfolio_construction: risk_constrained
      - model: ridge_locked
        alpha_pipeline: industry_size_neutralized
        portfolio_construction: risk_constrained
      benchmark: pit_industry_style_matched_peer_replica
      market_benchmarks:
      - CSI500_price
      - CSI500_total_return
      model_training_window: expanding_from_2006
      target: fwd_return_5d_lag1
      rebalance_frequency: weekly
      historical_oos_used_for_selection: false
    cost_and_execution:
      primary_cost_scenario: C0_fixed_020bp
      secondary_cost_scenario: C2_public_levies_commission_scenario
      primary_round_trip_cost_bps: 20.0
      execution_convention: returns_accrue_before_close_trade_blocked_orders_retry_daily
      limitations:
      - daily_bar_execution_approximation
      - no_bid_ask_quote_history
      - no_broker_calibrated_market_impact
      - incomplete_intraday_limit_queue_and_ipo_no_limit_windows
    statistical_plan:
      primary_hypothesis: hgb_raw_incremental_net_return_vs_style_matched_benchmark_positive
      secondary_hypotheses:
      - hgb_industry_size_neutralized_incremental_net_return_positive
      - ridge_raw_incremental_net_return_positive
      - ridge_industry_size_neutralized_incremental_net_return_positive
      paired_clock: common_daily_dates
      bootstrap: circular_block_bootstrap
      block_length_trading_days: 20
      bootstrap_samples: 2000
      bootstrap_seed: 20261020
      familywise_strategy_count: 4
      multiplicity_control: benjamini_hochberg
      false_discovery_rate: 0.05
      primary_metrics:
      - incremental_net_return_annualized_arithmetic
      - mean_rank_ic
      secondary_metrics:
      - risk_free_adjusted_sharpe
      - maximum_drawdown
      - turnover
      - return_per_turnover
      - target_tracking_error
      - cash_weight
      decision_rule: no_parameter_or_strategy_change_from_lockbox_or_paper_results_without_new_version
    source_artifacts:
    - table: model_benchmark_selection
      key: v1
    - table: model_stability_protocol
      key: v1
    - table: constrained_portfolio_protocol
      key: v1
    - table: constrained_daily_execution_protocol
      key: v1
    - table: transaction_cost_protocol
      key: v1
    - table: incremental_alpha_protocol
      key: v1
    - table: market_benchmark_protocol
      key: v1
    - table: risk_free_rate_attribution_protocol
      key: v1
    - table: research_conclusion_decisions
      key: v2
    access_log:
      path: reports/governance/research_access_log.jsonl
      hash_chained: true
      append_only_policy: true
      required_fields:
      - actor
      - evidence_class
      - action
      - reason
      - result_accessed
      - used_for_change
      consume_actions:
      - VIEW_RESULTS
      - EXPORT_RESULTS
      - USE_FOR_CHANGE
