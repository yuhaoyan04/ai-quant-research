    artifact_key: v3
    report_path: reports/engineering_quality_v3.md
    evidence_class: governance_only
    research_selection_role: governance
    claims_independent_evidence: false
    historical_oos_used_for_selection: false
    canonical_execution_market_module: src/quant_research/execution_market.py
    minimum_frozen_experiments: 61
    critical_protocols:
    - stage: factor_research
      table: factor_tear_sheet_protocol
      key: v1
      frozen_experiment: factor_tear_sheet_v1
    - stage: factor_and_model_neutralization
      table: model_neutralization_protocol
      key: v1
      frozen_experiment: model_portfolio_neutralization_v2
    - stage: phase1_costs
      table: transaction_cost_protocol
      key: v1
