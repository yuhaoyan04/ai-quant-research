        selection_allowed: true
        already_observed: true
      validation_selection:
        start_date: '2016-01-01'
        end_date: '2020-12-31'
        evidence_class: validation_selection
        selection_allowed: true
        already_observed: true
      historical_oos:
        start_date: '2021-01-01'
        end_date: '2026-09-30'
