    scope_note: Read-only Phase 7 accounting normalization of the already frozen Phase
      5 primary account. It does not change targets, fills, costs, positions or returns.
      The legacy corporate-action table omitted scenario identity after concatenating
      two simulations; account-specific action rows are therefore reconstructed from
      the selected account's prior holdings and the frozen market action fields, while
      the legacy defect remains disclosed.
  institutional_execution.yaml:
    experiment_id: institutional_execution_v1
    source_experiment: research_governance_v1
    evidence_class: historical_oos_descriptive
    research_selection_role: diagnostic
    claims_independent_evidence: false
    historical_oos_used_for_selection: false
