  title: Locked expanding-window preprocessing historical OOS
  stage: factor_preprocessing_historical_oos
  model_version: ridge_full15_quantile_zscore_lambda_1
  dataset_version_method: sha256_of_registered_inputs_and_ingestion_manifest
  historical_oos_used_for_selection: false
