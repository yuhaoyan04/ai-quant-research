        severity: superseded_conclusion_baseline
        reason: V3 adds the validation-only residual-target share-execution decision,
          reliable 2016-2020 CCDC risk-free rates, the unique daily-NAV correction,
          and the observed implementation shortfall. V2 remains correct for all pre-existing
          historical-OOS questions but is no longer the complete decision hierarchy.
