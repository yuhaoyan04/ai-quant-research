        superseded_by: research_conclusion_audit_v3
      final_research_baseline_v4:
        invalidated_at_utc: '2026-10-21T05:55:00Z'
        severity: superseded_publication_baseline
        reason: V5 incorporates the Phase 12.2 share-execution evidence, invalidates
          the overlapping five-day Phase 12.1 portfolio-return claims, and updates
          the final report, executive summary, resume and interview materials.
        unaffected_outputs:
        - all immutable final_research_baseline_v4 files
        - all pre-existing historical-OOS metrics and conclusions
        invalid_outputs:
        - claims that v4 is the current publication baseline
        superseded_by: final_research_baseline_v5
      idiosyncratic_portfolio_validation_v1:
        invalidated_at_utc: '2026-10-21T05:40:58Z'
        severity: overlapping_five_day_returns_not_a_unique_nav_clock
        reason: The target-weight experiment evaluated every weekly signal with a
