experiment_id: ic_decay_v1
registry_version: 1
selection_policy: validation_only
historical_oos_disclosure: The 2021-2026 block has already been inspected during project
  development. It is historical out-of-sample evidence, not a pristine production
  lockbox.
experiment:
  title: Composite and single-factor multi-horizon IC decay
  stage: factor_decay_diagnostics
  model_version: locked_quantile_zscore_ridge
  dataset_version_method: sha256_of_registered_inputs_and_ingestion_manifest
  historical_oos_used_for_selection: false
  config_files:
  - preprocessing.yaml
  - factor_preprocessing_selected.yaml
  - factor_preprocessing_oos.yaml
  - ic_decay.yaml
  input_tables:
  - table: factor_preprocessing_oos_predictions
    key: v1
  - table: ic_decay_panel
    key: v1
  metric_tables:
  - table: ic_decay_summary
    key: v1
  - table: ic_decay_annual
    key: v1
  figures: []
resolved_configs:
  preprocessing.yaml:
    factor_columns:
    - momentum_20d
    - momentum_60d
    - momentum_120d
    - momentum_20d_skip_5d
    - reversal_5d
    - volatility_20d
    - amihud_20d
    - turnover_20d
    - turnover_surprise_20d
    - volume_surprise_20d
    - amplitude_20d
    - return_volume_corr_20d
    - max_return_20d
    - earnings_yield
    - book_to_price
    target: fwd_return_5d_lag1
    winsorization:
      method: cross_sectional_median_mad
      mad_multiplier: 5.0
    normalization: cross_sectional_zscore
    missing_strategy: cross_sectional_median_plus_indicator
    minimum_cross_section_size: 100
    neutralization: none_pit_exposures_unavailable
  factor_preprocessing_selected.yaml:
    decision_id: factor_preprocessing_selection_v1
    locked_at_utc: '2026-10-14T12:30:00Z'
    selected_on: validation_2016_2020_only
    historical_oos_used_for_selection: false
    historical_oos_disclosure: The preprocessing decision was produced without querying
      2021+ observations in this ablation. However, the project's older baseline OOS
      results had already been inspected, so subsequent 2021+ evaluation remains historical
      OOS rather than a pristine lockbox.
    pipeline:
      winsor_method: quantile
      quantile_limits:
      - 0.01
      - 0.99
      normalization_method: cross_sectional_zscore
      missing_strategy: cross_sectional_median_plus_indicator
      ridge_penalty_per_observation: 1.0
      feature_set: full_15_factors
    selection_rule:
      primary: mean_rank_ic
      tiebreakers:
      - portfolio_sharpe_zero_rate
      - portfolio_annualized_return
      validation_mean_rank_ic: 0.088893
      validation_annualized_icir: 4.638006
    oos_evaluation_protocol:
      years:
      - 2021
      - 2022
      - 2023
      - 2024
      - 2025
      - 2026
      refit: expanding_window_at_start_of_each_year
      purge_latest_label_horizon: true
      top_n: 200
      round_trip_cost_bps: 20.0
      no_reselection: true
  factor_preprocessing_oos.yaml:
    experiment_id: factor_preprocessing_oos_v1
    selection_lock: factor_preprocessing_selection_v1
    historical_oos_disclosure: The preprocessing rule was locked on 2006-2020 before
      this experiment queried 2021+ data. The project's older baselines had already
      exposed this period, so results are historical OOS evidence rather than a pristine
      production lockbox.
    train_start_year: 2006
    test:
      start_year: 2021
      end_year: 2026
    target: fwd_return_5d_lag1
    label_horizon_trading_days: 5
    minimum_cross_section_size: 100
    annualization_periods: 52
    include_missing_indicators: true
    quantile_limits:
    - 0.01
    - 0.99
    mad_multiplier: 5.0
    pipelines:
      selected_quantile_zscore:
        winsor_method: quantile
        normalization_method: zscore
        ridge_penalty_per_observation: 1.0
        selected_on_validation: true
      reference_mad_zscore:
        winsor_method: mad
        normalization_method: zscore
        ridge_penalty_per_observation: 1.0
        selected_on_validation: false
    portfolio:
      top_n: 200
      round_trip_cost_bps: 20.0
      minimum_realized_weight_fraction: 0.95
    bootstrap:
      block_length_weeks: 13
      samples: 5000
      random_seed: 20261014
  ic_decay.yaml:
    experiment_id: ic_decay_v1
    source_prediction_experiment: factor_preprocessing_oos_v1
    period: historical_oos_2021_2026
    historical_oos_used_for_selection: false
    minimum_cross_section_size: 100
    annualization_periods: 52
    newey_west_lags: 4
    quantile_limits:
    - 0.01
    - 0.99
    mad_multiplier: 5.0
    include_missing_indicators: false
    targets:
    - name: cumulative_5d
      column: fwd_return_5d_lag1
      end_day: 5
    - name: cumulative_10d
      column: fwd_return_10d_lag1
      end_day: 10
    - name: cumulative_20d
      column: fwd_return_20d_lag1
      end_day: 20
    - name: incremental_6_10d
      column: incremental_return_6_10d_lag1
      start_day: 6
      end_day: 10
    - name: incremental_11_20d
      column: incremental_return_11_20d_lag1
      start_day: 11
      end_day: 20
