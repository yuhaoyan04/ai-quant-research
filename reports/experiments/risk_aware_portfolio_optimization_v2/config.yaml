resolved_configs:
  constrained_portfolio_neutralization.yaml:
    experiment_id: constrained_portfolio_neutralization_v1
    historical_oos_used_for_selection: false
    source_experiment: model_portfolio_neutralization_v2
    target: fwd_return_5d_lag1
    label_horizon_trading_days: 5
    train:
      start_year: 2006
      end_year: 2015
    historical_oos:
      start_year: 2021
      end_year: 2026
    alpha_pipelines:
    - raw
    - industry_size_neutralized
    models:
      ridge_locked:
        kind: ridge
        penalty_per_observation: 1.0
      hgb_shallow15_locked:
        kind: hgb
        learning_rate: 0.05
        max_iter: 120
        max_leaf_nodes: 15
        min_samples_leaf: 100
        l2_regularization: 1.0
    minimum_industry_group_size: 5
    minimum_cross_section_size: 100
    sample_per_training_date: 300
    random_state: 20261016
    annualization_periods: 52
    quantile_limits:
    - 0.01
    - 0.99
    mad_multiplier: 5.0
    include_missing_indicators: true
    portfolio:
      constructions:
      - top200_equal
      - risk_constrained
      baseline_top_n: 200
      round_trip_cost_bps: 20.0
      minimum_realized_weight_fraction: 0.95
    optimizer:
      method: scipy_highs_linear_program
      objective: maximize_cross_sectional_score_rank
      maximum_stock_weight: 0.005
      industry_active_weight_bound: 0.03
      absolute_size_z_bound: 0.1
      weekly_turnover_limit: 0.3
      turnover_feasibility_relaxation:
      - 0.3
      - 0.4
      - 0.5
      - 0.75
      - 1.0
      candidate_top_n: 800
      industry_capacity_buffer_names: 10
      size_tail_candidates_each_side: 100
      minimum_reported_weight: 1.0e-08
    bootstrap:
      block_length_weeks: 13
      samples: 2000
      random_seed: 20261017
    interpretation: Prespecified policy experiment. Constraint values are not selected
      on the 2021-2026 historical OOS. Turnover is relaxed only when required for
      LP feasibility and every relaxation is reported.
  multi_factor_risk_attribution.yaml:
    experiment_id: multi_factor_risk_attribution_v1
    historical_oos_used_for_selection: false
    source_experiment: constrained_portfolio_neutralization_v1
    target: fwd_return_5d_lag1
    risk_model:
      start_year: 2008
      end_year: 2026
    attribution:
      start_year: 2021
      end_year: 2026
    portfolio_construction: risk_constrained
    benchmark: equal_weight_pit_exposure_complete_universe
    regression: equal_weight_cross_sectional_ols
    industry_level: csrc_broad_section
    styles:
    - size
    - beta
    - volatility
    - liquidity
    - value
    - momentum
    beta:
      benchmark_instrument: sh.000905
      lookback_trading_days: 252
      minimum_observations: 120
    style_winsor_quantiles:
    - 0.01
    - 0.99
    covariance:
      trailing_weeks: 104
      minimum_weeks: 52
      ewma_half_life_weeks: 26
      diagonal_shrinkage: 0.2
    specific_risk:
      ewma_half_life_weeks: 26
      minimum_observations: 26
    annualization_periods: 52
    bootstrap:
      block_length_weeks: 13
      samples: 2000
      random_seed: 20261017
    scope_note: weekly_five_day_label_attribution_not_daily_execution_attribution
  risk_aware_portfolio_optimization.yaml:
    experiment_id: risk_aware_portfolio_optimization_v2
    artifact_key: v2
    historical_oos_used_for_selection: false
    source_experiment: multi_factor_risk_attribution_v1
    source_portfolio_experiment: constrained_portfolio_neutralization_v1
    target: fwd_return_5d_lag1
    risk_model:
      start_year: 2008
      end_year: 2026
    historical_oos:
      start_year: 2021
      end_year: 2026
    candidate_source_constructions:
    - top200_equal
    - risk_constrained
    carry_previous_holdings: true
    carry_minimum_weight: 0.0001
    styles:
    - size
    - beta
    - volatility
    - liquidity
    - value
    - momentum
    annualization_periods: 52
    portfolio:
      round_trip_cost_bps: 20.0
      minimum_realized_weight_fraction: 0.95
    optimizer:
      method: conditional_gradient_with_highs_linear_oracle
      objective: minimize_lagged_ex_ante_active_variance
      alpha_utility_retention_fraction: 0.98
      maximum_stock_weight: 0.005
      industry_active_weight_bound: 0.03
      absolute_size_z_bound: 0.1
      weekly_turnover_limit: 0.3
      turnover_feasibility_relaxation:
      - 0.3
      - 0.4
      - 0.5
      - 0.75
      - 1.0
      maximum_iterations: 8
      duality_gap_tolerance: 1.0e-08
      minimum_reported_weight: 1.0e-08
    target_volatility:
      annualized_target: 0.2
      minimum_risky_weight: 0.5
      maximum_risky_weight: 1.0
      allow_leverage: false
    bootstrap:
      block_length_weeks: 13
      samples: 2000
      random_seed: 20261018
    interpretation: Prespecified policy experiment. The optimizer uses only factor
      covariance and stock-specific variance estimates available before each signal
      date. It carries prior holdings with zero current alpha utility, and minimizes
      ex-ante active variance while retaining 98% of the maximum feasible current-candidate
      score utility. The 20% target-volatility overlay holds residual capital in zero-return
      cash and never leverages.
  experiment_invalidations.yaml:
    invalidations:
      factor_preprocessing_ablation_v1:
        invalidated_at_utc: '2026-10-14T12:45:00Z'
        severity: portfolio_metrics_invalid
        reason: Validation portfolios were formed after filtering rows with non-null
          future returns. RankIC and model-selection metrics used the correct realized
          subset, but Top-200 portfolio metrics had outcome-availability leakage.
        unaffected_outputs:
        - factor_preprocessing_ablation_selection/v1
        - factor_preprocessing_ablation_daily/v1
        - factor_preprocessing_ablation_factor_summary/v1
        invalid_outputs:
        - factor_preprocessing_ablation_portfolio/v1
        - portfolio fields in factor_preprocessing_ablation_grid/v1
        - portfolio fields in factor_preprocessing_ablation_annual/v1
        superseded_by: factor_preprocessing_ablation_v2
      model_benchmark_v1:
        invalidated_at_utc: '2026-10-15T12:00:00Z'
        severity: portfolio_metrics_execution_idealized
        reason: Model ranking and RankIC are valid, but the benchmark Top-200 portfolio
          assumes every next-day rebalance is filled. RandomForest disproportionately
          selected stocks blocked by next-day price limits or suspensions, materially
          inflating validation returns and modestly inflating historical-OOS returns.
        unaffected_outputs:
        - model_benchmark_validation_grid/v1 RankIC fields
        - model_benchmark_selection/v1
        - model_benchmark_oos_summary/v1 RankIC fields
        - model_benchmark_oos_annual/v1 RankIC fields
        invalid_outputs:
        - unqualified portfolio return and Sharpe claims from model_benchmark_validation_grid/v1
        - unqualified portfolio return and Sharpe claims from model_benchmark_oos_summary/v1
        superseded_by: rf_daily_retry_execution_v1
      rf_execution_forensics_v1:
        invalidated_at_utc: '2026-10-15T16:00:00Z'
        severity: execution_timing_incomplete
        reason: The weekly constrained simulator applied a blocked next-day order
          only at the following weekly rebalance. It also evaluated every signal with
          a full five-day label even when holiday-week signal dates were fewer than
          five trading days apart, creating overlapping portfolio return intervals.
          The price-limit diagnosis remains valid, but its 19.09% validation and 24.19%
          historical-OOS returns are not the final executable estimates.
        unaffected_outputs:
        - rf_forensic_label_audit/v1
        - rf_forensic_holdings_summary/v1 size and missingness fields
        - qualitative finding that RF concentrates in blocked small-cap names
        invalid_outputs:
        - rf_forensic_summary/v1 constrained portfolio metrics
        - rf_oos_execution_summary/v1 constrained portfolio metrics
        superseded_by: rf_daily_retry_execution_v1
      factor_neutralization_v1:
        invalidated_at_utc: '2026-10-17T00:00:00Z'
        severity: upstream_snapshot_truncation
        reason: BaoStock security snapshots for 2023-06-16 and 2025-10-10 were silently
          truncated at pagination boundaries. The affected PIT universe, factor panel,
          and industry exposure partitions were repaired and the experiment was rerun.
        unaffected_outputs: []
        invalid_outputs:
        - all factor_neutralization_v1 conclusions and metrics
        superseded_by: factor_neutralization_v2
      model_portfolio_neutralization_v1:
        invalidated_at_utc: '2026-10-17T00:00:00Z'
        severity: upstream_snapshot_truncation
        reason: BaoStock security snapshots for 2023-06-16 and 2025-10-10 were silently
          truncated at pagination boundaries. The affected PIT universe, feature,
          and industry exposure partitions were repaired and the locked models were
          rerun.
        unaffected_outputs: []
        invalid_outputs:
        - all model_portfolio_neutralization_v1 conclusions and metrics
        superseded_by: model_portfolio_neutralization_v2
      risk_aware_portfolio_optimization_v1:
        invalidated_at_utc: '2026-10-17T06:00:00Z'
        severity: frozen_provenance_incomplete
        reason: The first immutable registration accidentally reused the constrained
          daily execution input-list YAML anchor. Research tables and conclusions
          are valid, but the frozen metadata omitted the full PIT beta, panel, size,
          and industry dependency set consumed by the risk optimizer.
        unaffected_outputs:
        - all risk_aware_portfolio v1 research metrics and conclusions
        invalid_outputs:
        - risk_aware_portfolio_optimization_v1 frozen input provenance
        superseded_by: risk_aware_portfolio_optimization_v2
