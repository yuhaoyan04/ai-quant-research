resolved_configs:
  preprocessing.yaml:
    factor_columns:
    - momentum_20d
    - momentum_60d
    - momentum_120d
    - momentum_20d_skip_5d
    - reversal_5d
    - volatility_20d
    - amihud_20d
    - turnover_20d
    - turnover_surprise_20d
    - volume_surprise_20d
    - amplitude_20d
    - return_volume_corr_20d
    - max_return_20d
    - earnings_yield
    - book_to_price
    target: fwd_return_5d_lag1
    winsorization:
      method: cross_sectional_median_mad
      mad_multiplier: 5.0
    normalization: cross_sectional_zscore
    missing_strategy: cross_sectional_median_plus_indicator
    minimum_cross_section_size: 100
    neutralization: none_pit_exposures_unavailable
  factor_preprocessing_selected.yaml:
    decision_id: factor_preprocessing_selection_v1
    locked_at_utc: '2026-10-14T12:30:00Z'
    selected_on: validation_2016_2020_only
    historical_oos_used_for_selection: false
    historical_oos_disclosure: The preprocessing decision was produced without querying
      2021+ observations in this ablation. However, the project's older baseline OOS
      results had already been inspected, so subsequent 2021+ evaluation remains historical
      OOS rather than a pristine lockbox.
    pipeline:
      winsor_method: quantile
      quantile_limits:
      - 0.01
      - 0.99
      normalization_method: cross_sectional_zscore
      missing_strategy: cross_sectional_median_plus_indicator
      ridge_penalty_per_observation: 1.0
      feature_set: full_15_factors
    selection_rule:
      primary: mean_rank_ic
      tiebreakers:
      - portfolio_sharpe_zero_rate
      - portfolio_annualized_return
      validation_mean_rank_ic: 0.088893
      validation_annualized_icir: 4.638006
    oos_evaluation_protocol:
      years:
      - 2021
      - 2022
      - 2023
      - 2024
      - 2025
      - 2026
      refit: expanding_window_at_start_of_each_year
      purge_latest_label_horizon: true
      top_n: 200
      round_trip_cost_bps: 20.0
      no_reselection: true
  risk_exposure.yaml:
    asset_version: pit_risk_exposures_v2
    start_year: 2006
    end_year: 2026
    size_proxy: amount_cny_divided_by_turnover_fraction
    turnover_input_unit: percent
    weekly_date_rule: same_dates_as_multi_horizon_factor_panel
    industry_status: historical_csrc_weekly_snapshots_available
    industry_safety_rule: never_backfill_current_industry_into_history
    industry_source: baostock.query_stock_industry(date)
    industry_classification: CSRC
    industry_grouping: broad_section_with_semantic_legacy_bridge
    industry_snapshot_rule: month_end_plus_initial
    industry_asof_join: latest_snapshot_on_or_before_signal_date
    industry_snapshot_table: industry_snapshot_baostock
    industry_minimum_coverage: 0.95
  factor_neutralization.yaml:
    experiment_id: factor_neutralization_v2
    factor_source: multi_horizon_factor_panel
    industry_source: pit_industry_exposures_v1
    size_source: pit_size_exposures_v1
    target: fwd_return_5d_lag1
    train:
      start_year: 2006
      end_year: 2015
    validation:
      start_year: 2016
      end_year: 2020
    historical_oos:
      start_year: 2021
      end_year: 2026
    pipelines:
    - raw
    - size_neutralized
    - industry_neutralized
    - industry_size_neutralized
    industry_level: csrc_broad_section
    minimum_industry_group_size: 5
    minimum_cross_section_size: 100
    annualization_periods: 52
    quantile_limits:
    - 0.01
    - 0.99
    mad_multiplier: 5.0
    factor_top_quantile: 0.2
    bootstrap:
      block_length_weeks: 13
      samples: 2000
      random_seed: 20261016
    interpretation: paired_factor_risk_residualization_without_model_reselection
    direction_rule: sign_of_raw_training_mean_rank_ic
    historical_oos_used_for_selection: false
  model_portfolio_neutralization.yaml:
    experiment_id: model_portfolio_neutralization_v2
    historical_oos_used_for_selection: false
    factor_source: multi_horizon_factor_panel
    industry_source: pit_industry_exposures_v1
    size_source: pit_size_exposures_v1
    target: fwd_return_5d_lag1
    label_horizon_trading_days: 5
    train:
      start_year: 2006
      end_year: 2015
    validation:
      start_year: 2016
      end_year: 2020
    historical_oos:
      start_year: 2021
      end_year: 2026
    pipelines:
    - raw
    - size_neutralized
    - industry_neutralized
    - industry_size_neutralized
    models:
      ridge_locked:
        kind: ridge
        penalty_per_observation: 1.0
      hgb_shallow15_locked:
        kind: hgb
        learning_rate: 0.05
        max_iter: 120
        max_leaf_nodes: 15
        min_samples_leaf: 100
        l2_regularization: 1.0
    industry_level: csrc_broad_section
    minimum_industry_group_size: 5
    minimum_cross_section_size: 100
    sample_per_training_date: 300
    random_state: 20261016
    annualization_periods: 52
    portfolio_buckets: 10
    quantile_limits:
    - 0.01
    - 0.99
    mad_multiplier: 5.0
    include_missing_indicators: true
    portfolio:
      construction: equal_weight_top_n
      top_n: 200
      round_trip_cost_bps: 20.0
      minimum_realized_weight_fraction: 0.95
      explicit_industry_constraint: false
    bootstrap:
      block_length_weeks: 13
      samples: 2000
      random_seed: 20261017
    interpretation: Locked-model attribution experiment. It changes factor residualization
      only; it does not reselect models or impose portfolio-level industry constraints.
