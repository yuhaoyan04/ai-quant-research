experiment_id: transaction_cost_model_v1
registry_version: 1
selection_policy: validation_only
historical_oos_disclosure: The 2021-2026 block has already been inspected during project
  development. It is historical out-of-sample evidence, not a pristine production
  lockbox.
experiment:
  title: Fill-reconciled fixed and date-effective transaction-cost protocol
  stage: transaction_cost_and_turnover_protocol
  model_version: fixed_c0_fill_path_component_cost_v1
  dataset_version_method: sha256_of_registered_inputs_and_ingestion_manifest
  historical_oos_used_for_selection: false
  config_files:
  - constrained_portfolio_daily_execution.yaml
  - transaction_cost_model.yaml
  - experiment_invalidations.yaml
  input_tables:
  - table: constrained_execution_targets
    key: v1
  - table: constrained_daily_execution_market
    key: v1
  - table: constrained_daily_execution_daily
    key: v1
  - table: transaction_cost_fill_detail
    key: v1
  - table: transaction_cost_daily
    key: v1
  metric_tables:
  - table: transaction_cost_protocol
    key: v1
  - table: transaction_cost_summary
    key: v1
  - table: transaction_cost_reconciliation
    key: v1
  - table: transaction_cost_c0_regression
    key: v1
  figures: []
resolved_configs:
  constrained_portfolio_daily_execution.yaml:
    experiment_id: constrained_portfolio_daily_execution_v1
    historical_oos_used_for_selection: false
    source_experiment: constrained_portfolio_neutralization_v1
    source_holdings:
      table: constrained_portfolio_oos_holdings
      key: v1
    target_construction: risk_constrained
    round_trip_cost_bps: 20.0
    annualization_periods: 252
    label_horizon_trading_days: 5
    limit_detection_tolerance_percentage_points: 0.2
    bootstrap:
      block_length_trading_days: 20
      samples: 2000
      random_seed: 20261017
    rules:
      st_limit_pct: 5.0
      main_board_limit_pct: 10.0
      star_limit_pct: 20.0
      chinext_limit_pct_before_2020_08_24: 10.0
      chinext_limit_pct_after_2020_08_24: 20.0
    execution_convention: returns_accrue_before_close_trade_blocked_orders_retry_daily
    scope_note: conservative_close_limit_rule_intraday_queue_and_ipo_no_limit_windows_not_modeled
  transaction_cost_model.yaml:
    experiment_id: transaction_cost_model_v1
    source_experiment: constrained_portfolio_daily_execution_v1
    historical_oos_used_for_selection: false
    source_targets:
      table: constrained_execution_targets
      key: v1
    source_market:
      table: constrained_daily_execution_market
      key: v1
    source_daily_baseline:
      table: constrained_daily_execution_daily
      key: v1
    primary_execution_scenario: daily_retry_limit_and_suspension_constrained
    annualization_periods: 252
    baseline_round_trip_cost_bps: 20.0
    c0_regression_tolerance: 1.0e-12
    cost_path_policy: fixed_c0_fill_path_no_fee_feedback
    notional_unit: normalized_portfolio_nav_not_cny
    fixed_scenarios:
    - scenario_id: C1_fixed_000bp
      scenario_group: C1
      mode: fixed_round_trip
      round_trip_cost_bps: 0.0
      evidence_status: research_scenario
    - scenario_id: C1_fixed_010bp
      scenario_group: C1
      mode: fixed_round_trip
      round_trip_cost_bps: 10.0
      evidence_status: research_scenario
    - scenario_id: C0_fixed_020bp
      scenario_group: C0_C1
      mode: fixed_round_trip
      round_trip_cost_bps: 20.0
      evidence_status: existing_research_baseline
    - scenario_id: C1_fixed_040bp
      scenario_group: C1
      mode: fixed_round_trip
      round_trip_cost_bps: 40.0
      evidence_status: research_scenario
    - scenario_id: C1_fixed_060bp
      scenario_group: C1
      mode: fixed_round_trip
      round_trip_cost_bps: 60.0
      evidence_status: research_scenario
    - scenario_id: C1_fixed_100bp
      scenario_group: C1
      mode: fixed_round_trip
      round_trip_cost_bps: 100.0
      evidence_status: research_scenario
    component_scenarios:
    - scenario_id: C2_public_levies_commission_scenario
      scenario_group: C2
      mode: components
      evidence_status: documented_public_levies_plus_explicit_broker_commission_assumption
      description: Date-effective public stamp-duty and transfer-fee rules plus a
        symmetric 3bp commission scenario. This is not a historical broker statement
        and does not include a minimum commission because the research ledger uses
        normalized NAV rather than CNY account notionals.
      components:
        commission:
          minimum_fee_per_fill: 0.0
          evidence_status: explicit_scenario_not_historical_broker_truth
          rules:
          - start_date: '2021-01-01'
            end_date: null
            buy_bps: 3.0
            sell_bps: 3.0
        stamp_duty:
          minimum_fee_per_fill: 0.0
          evidence_status: official_tax_schedule
          sources:
          - https://www.mof.gov.cn/zhengwuxinxi/caizhengxinwen/200809/t20080919_76432.htm
          - https://fgk.chinatax.gov.cn/zcfgk/c102416/c5211343/content.html
          rules:
          - start_date: '2021-01-01'
            end_date: '2023-08-27'
            buy_bps: 0.0
            sell_bps: 10.0
          - start_date: '2023-08-28'
            end_date: null
            buy_bps: 0.0
            sell_bps: 5.0
        transfer_fee:
          minimum_fee_per_fill: 0.0
          evidence_status: official_or_officially_reported_clearing_schedule
          sources:
          - https://big5.sse.com.cn/site/cht/www.sse.com.cn/aboutus/mediacenter/hotandd/c/c_20150912_3988866.shtml
          - https://www.chinaclear.cn/zdjs/editor_file/20220701154723234.pdf
          rules:
          - start_date: '2021-01-01'
            end_date: '2022-04-28'
            buy_bps: 0.2
            sell_bps: 0.2
          - start_date: '2022-04-29'
            end_date: null
            buy_bps: 0.1
            sell_bps: 0.1
        spread:
          minimum_fee_per_fill: 0.0
          evidence_status: omitted_no_quote_data
          rules:
          - start_date: '2021-01-01'
            end_date: null
            buy_bps: 0.0
            sell_bps: 0.0
        market_impact:
          minimum_fee_per_fill: 0.0
          evidence_status: omitted_no_broker_calibration
          rules:
          - start_date: '2021-01-01'
            end_date: null
            buy_bps: 0.0
            sell_bps: 0.0
    scope_note: C0 and C1 hold the C0 executed-share path fixed and only reprice its
      fills. C2 is an auditable scenario, not a claim of historical account-level
      fees. C3-C5 remain blocked pending bid-ask, ADV and broker-calibrated impact
      data.
  experiment_invalidations.yaml:
    invalidations:
      portfolio_sensitivity_v1:
        invalidated_at_utc: '2026-10-20T06:10:00Z'
        severity: cost_stress_repricing_formula_superseded
        reason: The v1 fixed-fill execution cost stress subtracted turnover times
          the fee rate directly from gross return. The daily executor defines turnover
          over pre-trade NAV while return is measured over previous NAV, so exact
          C0 reproduction additionally requires the pre-trade-to-previous-NAV ratio.
          The difference is small but the v1 stress grid is not an exact 20bp regression
          of the executable baseline.
        unaffected_outputs:
        - portfolio_sensitivity_protocol/v1 except the cost-stress method claim
        - portfolio_sensitivity_weekly/v1
        - portfolio_sensitivity_summary/v1
        - qualitative conclusion that returns decline as fixed costs rise
        invalid_outputs:
        - exact values in execution_cost_stress/v1
        - claims that execution_cost_stress/v1 exactly reproduces C0 at 20bp
        superseded_by: transaction_cost_model_v1
      factor_preprocessing_ablation_v1:
        invalidated_at_utc: '2026-10-14T12:45:00Z'
        severity: portfolio_metrics_invalid
        reason: Validation portfolios were formed after filtering rows with non-null
          future returns. RankIC and model-selection metrics used the correct realized
          subset, but Top-200 portfolio metrics had outcome-availability leakage.
        unaffected_outputs:
        - factor_preprocessing_ablation_selection/v1
        - factor_preprocessing_ablation_daily/v1
        - factor_preprocessing_ablation_factor_summary/v1
        invalid_outputs:
        - factor_preprocessing_ablation_portfolio/v1
        - portfolio fields in factor_preprocessing_ablation_grid/v1
        - portfolio fields in factor_preprocessing_ablation_annual/v1
        superseded_by: factor_preprocessing_ablation_v2
      model_benchmark_v1:
        invalidated_at_utc: '2026-10-15T12:00:00Z'
        severity: portfolio_metrics_execution_idealized
        reason: Model ranking and RankIC are valid, but the benchmark Top-200 portfolio
          assumes every next-day rebalance is filled. RandomForest disproportionately
          selected stocks blocked by next-day price limits or suspensions, materially
          inflating validation returns and modestly inflating historical-OOS returns.
        unaffected_outputs:
        - model_benchmark_validation_grid/v1 RankIC fields
        - model_benchmark_selection/v1
        - model_benchmark_oos_summary/v1 RankIC fields
        - model_benchmark_oos_annual/v1 RankIC fields
        invalid_outputs:
        - unqualified portfolio return and Sharpe claims from model_benchmark_validation_grid/v1
        - unqualified portfolio return and Sharpe claims from model_benchmark_oos_summary/v1
        superseded_by: rf_daily_retry_execution_v1
      rf_execution_forensics_v1:
        invalidated_at_utc: '2026-10-15T16:00:00Z'
        severity: execution_timing_incomplete
        reason: The weekly constrained simulator applied a blocked next-day order
          only at the following weekly rebalance. It also evaluated every signal with
          a full five-day label even when holiday-week signal dates were fewer than
          five trading days apart, creating overlapping portfolio return intervals.
          The price-limit diagnosis remains valid, but its 19.09% validation and 24.19%
          historical-OOS returns are not the final executable estimates.
        unaffected_outputs:
        - rf_forensic_label_audit/v1
        - rf_forensic_holdings_summary/v1 size and missingness fields
        - qualitative finding that RF concentrates in blocked small-cap names
        invalid_outputs:
        - rf_forensic_summary/v1 constrained portfolio metrics
        - rf_oos_execution_summary/v1 constrained portfolio metrics
        superseded_by: rf_daily_retry_execution_v1
      factor_neutralization_v1:
        invalidated_at_utc: '2026-10-17T00:00:00Z'
        severity: upstream_snapshot_truncation
        reason: BaoStock security snapshots for 2023-06-16 and 2025-10-10 were silently
          truncated at pagination boundaries. The affected PIT universe, factor panel,
          and industry exposure partitions were repaired and the experiment was rerun.
        unaffected_outputs: []
        invalid_outputs:
        - all factor_neutralization_v1 conclusions and metrics
        superseded_by: factor_neutralization_v2
      model_portfolio_neutralization_v1:
        invalidated_at_utc: '2026-10-17T00:00:00Z'
        severity: upstream_snapshot_truncation
        reason: BaoStock security snapshots for 2023-06-16 and 2025-10-10 were silently
