[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-quant-research"
version = "0.1.0"
description = "Auditable point-in-time A-share factor and machine-learning research pipeline"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "PyYAML>=6.0",
  "baostock>=0.8.9",
  "akshare>=1.18",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "tzdata>=2024.1",
  "scipy>=1.13",
  "tabulate>=0.9",
  "reportlab>=4.2",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
quant-lake = "quant_research.ingest:main"
quant-free-lake = "quant_research.free_ingest:main"
quant-research = "quant_research.pipeline:main"
quant-dashboard = "quant_research.dashboard:main"
quant-monitor = "quant_research.monitor:main"
quant-materialize = "quant_research.materialize:main"
quant-preprocess = "quant_research.preprocessing:main"
quant-feature-analysis = "quant_research.feature_analysis:run"
quant-model-baseline = "quant_research.model_baseline:run"
quant-portfolio = "quant_research.portfolio:run"
quant-liquidity-stress = "quant_research.liquidity_stress:run"
quant-capacity = "quant_research.capacity:main"
quant-turnover-buffer = "quant_research.turnover_buffer:run"
quant-capacity-execution = "quant_research.capacity_execution:run"
quant-model-challenger = "quant_research.model_challenger:run"
quant-challenger-portfolio = "quant_research.challenger_portfolio:run"
quant-robustness = "quant_research.robustness:run"
quant-model-interpretation = "quant_research.model_interpretation:run"
quant-size-stress = "quant_research.size_stress:main"
quant-execution-constraints = "quant_research.execution_constraints:main"
quant-research-dashboard = "quant_research.research_dashboard:main"
quant-audit = "quant_research.audit:main"
quant-experiment = "quant_research.experiment_registry:main"
quant-factor-preprocessing-ablation = "quant_research.factor_preprocessing_ablation:run"
quant-factor-preprocessing-oos = "quant_research.factor_preprocessing_oos:run"
quant-ic-decay = "quant_research.ic_decay:run"
quant-lofo = "quant_research.leave_one_factor_out:run"
quant-label-panel = "quant_research.label_panel:main"
quant-label-horizon = "quant_research.label_horizon:run"
quant-risk-exposure = "quant_research.risk_exposure:main"
quant-size-neutralization = "quant_research.size_neutralization:run"
quant-factor-neutralization = "quant_research.factor_neutralization:main"
quant-model-portfolio-neutralization = "quant_research.model_portfolio_neutralization:run"
quant-constrained-portfolio-neutralization = "quant_research.constrained_portfolio_neutralization:run"
quant-constrained-daily-execution = "quant_research.constrained_portfolio_daily_execution:main"
quant-risk-attribution = "quant_research.multi_factor_risk_attribution:main"
quant-risk-aware-portfolio = "quant_research.risk_aware_portfolio_optimization:main"
quant-factor-tear-sheet = "quant_research.factor_tear_sheet:main"
quant-capm-attribution = "quant_research.capm_attribution:main"
quant-style-factor-attribution = "quant_research.style_factor_attribution:main"
quant-factor-registry = "quant_research.factor_registry:main"
quant-portfolio-sensitivity = "quant_research.portfolio_sensitivity:run"
quant-hgb-hyperparameter-stability = "quant_research.hgb_hyperparameter_stability:run"
quant-factor-visual-diagnostics = "quant_research.factor_visual_diagnostics:run"
quant-final-report = "quant_research.report_pdf:main"
quant-conclusion-audit = "quant_research.research_conclusion_audit:main"
quant-model-benchmark = "quant_research.model_benchmark:run"
quant-rf-hyperparameter-stability = "quant_research.rf_hyperparameter_stability:run"
quant-rf-return-forensics = "quant_research.rf_return_forensics:run"
quant-rf-oos-execution-audit = "quant_research.rf_oos_execution_audit:run"
quant-rf-target-holdings = "quant_research.rf_target_holdings:run"
quant-rf-daily-retry = "quant_research.rf_daily_retry_execution:main"
quant-incremental-alpha = "quant_research.incremental_alpha_test:main"
quant-transaction-costs = "quant_research.transaction_cost_analysis:main"
quant-risk-free-attribution = "quant_research.risk_free_rate_attribution:main"
quant-market-benchmark-attribution = "quant_research.market_benchmark_attribution:main"
quant-model-stability-validation = "quant_research.model_stability_validation:run"
quant-research-governance = "quant_research.research_governance:main"
quant-institutional-execution = "quant_research.institutional_execution:main"
quant-portfolio-construction-comparison = "quant_research.portfolio_construction_comparison:main"
quant-unified-account-ledger = "quant_research.unified_account_ledger:main"
quant-statistical-inference = "quant_research.statistical_inference:main"
quant-alpha-evidence = "quant_research.alpha_evidence_matrix:main"
quant-incremental-alpha-fill = "quant_research.incremental_alpha_fill_execution:main"
quant-engineering-quality = "quant_research.engineering_quality:main"
quant-paper-trading = "quant_research.paper_trading:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", "reports", ".git", ".venv", ".pytest_cache"]
